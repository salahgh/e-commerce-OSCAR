# Category Queries

query GetCategories {
  categories {
    id
    nameAr
    nameFr
    nameEn
    slug
    imageUrl
    parentId
    isActive
    productCount
  }
}

query GetCategory($id: Long!) {
  category(id: $id) {
    id
    nameAr
    nameFr
    nameEn
    descriptionAr
    descriptionFr
    descriptionEn
    slug
    imageUrl
    parentId
    parentName
    isActive
    displayOrder
    productCount
    children {
      id
      nameAr
      nameFr
      nameEn
      slug
      imageUrl
      productCount
    }
    createdAt
    updatedAt
  }
}

query GetCategoryBySlug($slug: String!) {
  categoryBySlug(slug: $slug) {
    id
    nameAr
    nameFr
    nameEn
    descriptionAr
    descriptionFr
    descriptionEn
    slug
    imageUrl
    parentId
    parentName
    isActive
    productCount
    children {
      id
      nameAr
      nameFr
      nameEn
      slug
      imageUrl
      productCount
    }
  }
}

query GetCategoryTree {
  categoryTree {
    id
    nameAr
    nameFr
    nameEn
    slug
    imageUrl
    productCount
    children {
      id
      nameAr
      nameFr
      nameEn
      slug
      imageUrl
      productCount
    }
  }
}

query GetActiveCategories {
  activeCategories {
    id
    nameAr
    nameFr
    nameEn
    slug
    imageUrl
    productCount
  }
}
