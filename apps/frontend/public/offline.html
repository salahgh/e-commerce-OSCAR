<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1E1E1E" />
    <title>Hors ligne — OSCAR Najar</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #ffffff; color: #010B38;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center; padding: 24px;
      }
      .wrap { max-width: 28rem; }
      .mark { font-size: 14px; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; color: #1E1E1E; }
      h1 { font-size: 1.5rem; font-weight: 700; margin: 1.25rem 0 0.5rem; }
      p { margin: 0.25rem 0; color: #475569; font-size: 0.95rem; line-height: 1.5; }
      .sub { font-size: 0.8rem; color: #94a3b8; }
      button {
        margin-top: 1.5rem; padding: 0.75rem 1.75rem; border: none; border-radius: 8px;
        background: #1E1E1E; color: #fff; font-size: 0.9rem; font-weight: 600; cursor: pointer;
      }
      button:hover { background: #000; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">OSCAR Najar</div>
      <h1>Vous êtes hors ligne</h1>
      <p>Vérifiez votre connexion internet et réessayez.</p>
      <p class="sub">You are offline · أنت غير متصل بالإنترنت</p>
      <button onclick="location.reload()">Réessayer</button>
    </div>
  </body>
</html>
