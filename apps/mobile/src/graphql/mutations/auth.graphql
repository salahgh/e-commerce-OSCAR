# Vendure Shop API - Authentication Mutations

fragment CurrentUserFields on CurrentUser {
  id
  identifier
  channels {
    id
    code
    token
    permissions
  }
}

fragment CustomerFields on Customer {
  id
  createdAt
  updatedAt
  firstName
  lastName
  emailAddress
  phoneNumber
  addresses {
    id
    fullName
    company
    streetLine1
    streetLine2
    city
    province
    postalCode
    country {
      code
      name
    }
    phoneNumber
    defaultShippingAddress
    defaultBillingAddress
  }
  customFields {
    avatar {
      id
      preview
    }
  }
}

# Login with email and password
mutation ShopLogin($username: String!, $password: String!, $rememberMe: Boolean) {
  login(username: $username, password: $password, rememberMe: $rememberMe) {
    ... on CurrentUser {
      ...CurrentUserFields
    }
    ... on InvalidCredentialsError {
      errorCode
      message
    }
    ... on NotVerifiedError {
      errorCode
      message
    }
    ... on NativeAuthStrategyError {
      errorCode
      message
    }
  }
}

# Logout the current user
mutation ShopLogout {
  logout {
    success
  }
}

# Register a new customer account
mutation ShopRegister($input: RegisterCustomerInput!) {
  registerCustomerAccount(input: $input) {
    ... on Success {
      success
    }
    ... on MissingPasswordError {
      errorCode
      message
    }
    ... on PasswordValidationError {
      errorCode
      message
      validationErrorMessage
    }
    ... on NativeAuthStrategyError {
      errorCode
      message
    }
  }
}

# Verify customer email with token
mutation VerifyCustomerAccount($token: String!, $password: String) {
  verifyCustomerAccount(token: $token, password: $password) {
    ... on CurrentUser {
      ...CurrentUserFields
    }
    ... on VerificationTokenInvalidError {
      errorCode
      message
    }
    ... on VerificationTokenExpiredError {
      errorCode
      message
    }
    ... on MissingPasswordError {
      errorCode
      message
    }
    ... on PasswordValidationError {
      errorCode
      message
      validationErrorMessage
    }
    ... on PasswordAlreadySetError {
      errorCode
      message
    }
    ... on NativeAuthStrategyError {
      errorCode
      message
    }
  }
}

# Resend verification email
mutation RefreshVerification($emailAddress: String!) {
  refreshCustomerVerification(emailAddress: $emailAddress) {
    ... on Success {
      success
    }
    ... on NativeAuthStrategyError {
      errorCode
      message
    }
  }
}

# Request password reset email
mutation RequestPasswordReset($emailAddress: String!) {
  requestPasswordReset(emailAddress: $emailAddress) {
    ... on Success {
      success
    }
    ... on NativeAuthStrategyError {
      errorCode
      message
    }
  }
}

# Reset password with token
mutation ResetPassword($token: String!, $password: String!) {
  resetPassword(token: $token, password: $password) {
    ... on CurrentUser {
      ...CurrentUserFields
    }
    ... on PasswordResetTokenInvalidError {
      errorCode
      message
    }
    ... on PasswordResetTokenExpiredError {
      errorCode
      message
    }
    ... on PasswordValidationError {
      errorCode
      message
      validationErrorMessage
    }
    ... on NativeAuthStrategyError {
      errorCode
      message
    }
    ... on NotVerifiedError {
      errorCode
      message
    }
  }
}

# Update customer profile
mutation UpdateCustomerProfile($input: UpdateCustomerInput!) {
  updateCustomer(input: $input) {
    ...CustomerFields
  }
}

# Upload / replace the customer's avatar image (multipart Upload)
mutation UpdateCustomerAvatar($file: Upload!) {
  updateCustomerAvatar(file: $file) {
    id
    customFields {
      avatar {
        id
        preview
      }
    }
  }
}

# Change password (when logged in)
mutation UpdateCustomerPassword($currentPassword: String!, $newPassword: String!) {
  updateCustomerPassword(currentPassword: $currentPassword, newPassword: $newPassword) {
    ... on Success {
      success
    }
    ... on InvalidCredentialsError {
      errorCode
      message
    }
    ... on PasswordValidationError {
      errorCode
      message
      validationErrorMessage
    }
    ... on NativeAuthStrategyError {
      errorCode
      message
    }
  }
}

# Create a new customer address
mutation CreateCustomerAddress($input: CreateAddressInput!) {
  createCustomerAddress(input: $input) {
    id
    fullName
    company
    streetLine1
    streetLine2
    city
    province
    postalCode
    country {
      code
      name
    }
    phoneNumber
    defaultShippingAddress
    defaultBillingAddress
  }
}

# Update an existing address
mutation UpdateCustomerAddress($input: UpdateAddressInput!) {
  updateCustomerAddress(input: $input) {
    id
    fullName
    company
    streetLine1
    streetLine2
    city
    province
    postalCode
    country {
      code
      name
    }
    phoneNumber
    defaultShippingAddress
    defaultBillingAddress
  }
}

# Delete an address
mutation DeleteCustomerAddress($id: ID!) {
  deleteCustomerAddress(id: $id) {
    success
  }
}
