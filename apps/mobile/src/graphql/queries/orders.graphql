# Vendure Shop API - Order Queries

fragment CustomerOrderFields on Order {
  id
  code
  state
  active
  createdAt
  updatedAt
  totalQuantity
  subTotalWithTax
  shippingWithTax
  totalWithTax
  currencyCode
  lines {
    id
    quantity
    linePriceWithTax
    unitPriceWithTax
    productVariant {
      id
      name
      sku
      product {
        id
        name
        slug
        featuredAsset {
          id
          preview
        }
      }
    }
    featuredAsset {
      id
      preview
    }
  }
  shippingAddress {
    fullName
    streetLine1
    streetLine2
    city
    province
    postalCode
    country
    phoneNumber
  }
  billingAddress {
    fullName
    streetLine1
    streetLine2
    city
    province
    postalCode
    country
    phoneNumber
  }
  shippingLines {
    shippingMethod {
      id
      name
      description
    }
    priceWithTax
  }
  payments {
    id
    method
    amount
    state
    transactionId
    createdAt
    metadata
  }
  fulfillments {
    id
    state
    method
    trackingCode
    createdAt
    lines {
      orderLineId
      quantity
    }
  }
}

# Get customer order history
query GetMyOrders($options: OrderListOptions) {
  activeCustomer {
    orders(options: $options) {
      items {
        id
        code
        state
        createdAt
        totalWithTax
        currencyCode
        totalQuantity
        payments {
          id
          method
          state
        }
        lines {
          id
          quantity
          productVariant {
            name
            product {
              name
              featuredAsset {
                preview
              }
            }
          }
          featuredAsset {
            preview
          }
        }
      }
      totalItems
    }
  }
}

# Get single order by code
query GetOrderByCode($code: String!) {
  orderByCode(code: $code) {
    ...CustomerOrderFields
  }
}

# Get single order by ID
query GetOrder($id: ID!) {
  order(id: $id) {
    ...CustomerOrderFields
  }
}

# Get next order states
query GetNextOrderStates {
  nextOrderStates
}
