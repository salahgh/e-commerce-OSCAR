# Vendure Shop API - Cart (Active Order) Operations

fragment OrderLineFields on OrderLine {
  id
  quantity
  linePriceWithTax
  unitPriceWithTax
  discountedUnitPriceWithTax
  productVariant {
    id
    name
    sku
    priceWithTax
    product {
      id
      name
      slug
      featuredAsset {
        id
        preview
      }
    }
    options {
      id
      code
      name
      group {
        id
        code
        name
      }
    }
  }
  featuredAsset {
    id
    preview
  }
}

fragment OrderFields on Order {
  id
  code
  state
  active
  createdAt
  updatedAt
  totalQuantity
  subTotalWithTax
  shippingWithTax
  totalWithTax
  currencyCode
  couponCodes
  lines {
    ...OrderLineFields
  }
  shippingAddress {
    fullName
    streetLine1
    streetLine2
    city
    province
    postalCode
    country
    phoneNumber
  }
  billingAddress {
    fullName
    streetLine1
    streetLine2
    city
    province
    postalCode
    country
    phoneNumber
  }
  customer {
    id
    firstName
    lastName
    emailAddress
  }
  shippingLines {
    shippingMethod {
      id
      name
    }
    priceWithTax
  }
}

# Get active order (cart)
query GetActiveOrder {
  activeOrder {
    ...OrderFields
  }
}

# Get eligible shipping methods
query GetEligibleShippingMethods {
  eligibleShippingMethods {
    id
    name
    description
    price
    priceWithTax
    metadata
  }
}

# Get eligible payment methods
query GetEligiblePaymentMethods {
  eligiblePaymentMethods {
    id
    name
    code
    description
    isEligible
    eligibilityMessage
  }
}
