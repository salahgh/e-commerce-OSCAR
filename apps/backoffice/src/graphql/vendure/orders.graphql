# Vendure Admin API - Order Operations

query AdminOrders($options: OrderListOptions) {
  orders(options: $options) {
    items {
      id
      code
      state
      orderPlacedAt
      createdAt
      updatedAt
      totalWithTax
      total
      currencyCode
      customer {
        id
        firstName
        lastName
        emailAddress
        phoneNumber
      }
      shippingLines {
        shippingMethod {
          id
          name
        }
        priceWithTax
      }
      payments {
        id
        method
        state
        amount
      }
      customFields {
        customerNotes
        adminNotes
        trackingNumber
        wilaya
        cancellationReason
      }
    }
    totalItems
  }
}

query AdminOrder($id: ID!) {
  order(id: $id) {
    id
    code
    state
    active
    orderPlacedAt
    createdAt
    updatedAt
    totalWithTax
    total
    subTotal
    subTotalWithTax
    currencyCode
    shipping
    shippingWithTax
    couponCodes
    discounts {
      type
      description
      amountWithTax
    }
    customer {
      id
      firstName
      lastName
      emailAddress
      phoneNumber
      customFields {
        wilaya
        city
      }
    }
    shippingAddress {
      fullName
      company
      streetLine1
      streetLine2
      city
      province
      postalCode
      country
      phoneNumber
    }
    billingAddress {
      fullName
      company
      streetLine1
      streetLine2
      city
      province
      postalCode
      country
      phoneNumber
    }
    lines {
      id
      quantity
      unitPrice
      unitPriceWithTax
      linePrice
      linePriceWithTax
      productVariant {
        id
        sku
        name
        product {
          id
          name
          featuredAsset {
            preview
          }
          translations {
            languageCode
            name
          }
        }
      }
    }
    shippingLines {
      shippingMethod {
        id
        name
        code
      }
      price
      priceWithTax
    }
    payments {
      id
      method
      state
      amount
      transactionId
      createdAt
      metadata
    }
    fulfillments {
      id
      state
      method
      trackingCode
      createdAt
      lines {
        orderLineId
        quantity
      }
    }
    history(options: { take: 50, sort: { createdAt: DESC } }) {
      items {
        id
        type
        createdAt
        data
        administrator {
          id
          firstName
          lastName
        }
      }
    }
    customFields {
      customerNotes
      adminNotes
      trackingNumber
      wilaya
      cancellationReason
    }
  }
}

# Transition order to a new state
mutation TransitionOrderToState($id: ID!, $state: String!) {
  transitionOrderToState(id: $id, state: $state) {
    ... on Order {
      id
      state
    }
    ... on OrderStateTransitionError {
      errorCode
      message
      transitionError
      fromState
      toState
    }
  }
}

# Add a note to order history
mutation AddNoteToOrder($input: AddNoteToOrderInput!) {
  addNoteToOrder(input: $input) {
    id
  }
}

# Update order custom fields (tracking, notes)
mutation UpdateOrderCustomFields($input: UpdateOrderInput!) {
  setOrderCustomFields(input: $input) {
    id
    customFields {
      trackingNumber
      adminNotes
      wilaya
    }
  }
}

# Cancel an order
mutation CancelOrder($input: CancelOrderInput!) {
  cancelOrder(input: $input) {
    ... on Order {
      id
      state
    }
    ... on EmptyOrderLineSelectionError {
      errorCode
      message
    }
    ... on QuantityTooGreatError {
      errorCode
      message
    }
    ... on MultipleOrderError {
      errorCode
      message
    }
    ... on CancelActiveOrderError {
      errorCode
      message
      orderState
    }
    ... on OrderStateTransitionError {
      errorCode
      message
      transitionError
    }
  }
}

# Create fulfillment
mutation CreateFulfillment($input: FulfillOrderInput!) {
  addFulfillmentToOrder(input: $input) {
    ... on Fulfillment {
      id
      state
      trackingCode
      method
    }
    ... on EmptyOrderLineSelectionError {
      errorCode
      message
    }
    ... on ItemsAlreadyFulfilledError {
      errorCode
      message
    }
    ... on InsufficientStockOnHandError {
      errorCode
      message
    }
    ... on CreateFulfillmentError {
      errorCode
      message
    }
    ... on FulfillmentStateTransitionError {
      errorCode
      message
    }
  }
}

# Record a manual payment (e.g. cash on delivery collected, bank transfer
# confirmed). Fully pays the outstanding amount via the chosen method.
mutation AddManualPaymentToOrder($input: ManualPaymentInput!) {
  addManualPaymentToOrder(input: $input) {
    ... on Order {
      id
      state
      payments {
        id
        method
        state
        amount
      }
    }
    ... on ManualPaymentStateError {
      errorCode
      message
    }
  }
}

# Settle (collect) an authorized payment.
mutation SettlePayment($id: ID!) {
  settlePayment(id: $id) {
    ... on Payment {
      id
      state
      transactionId
    }
    ... on SettlePaymentError {
      errorCode
      message
      paymentErrorMessage
    }
    ... on PaymentStateTransitionError {
      errorCode
      message
      transitionError
      fromState
      toState
    }
    ... on OrderStateTransitionError {
      errorCode
      message
      transitionError
      fromState
      toState
    }
  }
}

# Cancel an authorized (uncollected) payment.
mutation CancelPayment($id: ID!) {
  cancelPayment(id: $id) {
    ... on Payment {
      id
      state
    }
    ... on CancelPaymentError {
      errorCode
      message
      paymentErrorMessage
    }
    ... on PaymentStateTransitionError {
      errorCode
      message
      transitionError
      fromState
      toState
    }
  }
}

# Issue a refund against a specific payment for a given amount (in cents).
mutation RefundOrder($input: RefundOrderInput!) {
  refundOrder(input: $input) {
    ... on Refund {
      id
      state
      total
      reason
      transactionId
    }
    ... on QuantityTooGreatError {
      errorCode
      message
    }
    ... on NothingToRefundError {
      errorCode
      message
    }
    ... on OrderStateTransitionError {
      errorCode
      message
      transitionError
      fromState
      toState
    }
    ... on MultipleOrderError {
      errorCode
      message
    }
    ... on PaymentOrderMismatchError {
      errorCode
      message
    }
    ... on RefundOrderStateError {
      errorCode
      message
      orderState
    }
    ... on AlreadyRefundedError {
      errorCode
      message
      refundId
    }
    ... on RefundStateTransitionError {
      errorCode
      message
      transitionError
      fromState
      toState
    }
    ... on RefundAmountError {
      errorCode
      message
      maximumRefundable
    }
  }
}

# Mark a pending refund as settled (manual confirmation that the refund
# was processed externally — e.g. wire transfer back to customer).
mutation SettleRefund($input: SettleRefundInput!) {
  settleRefund(input: $input) {
    ... on Refund {
      id
      state
      transactionId
    }
    ... on RefundStateTransitionError {
      errorCode
      message
      transitionError
      fromState
      toState
    }
  }
}

# Force-advance a payment state (admin override).
mutation TransitionPaymentToState($id: ID!, $state: String!) {
  transitionPaymentToState(id: $id, state: $state) {
    ... on Payment {
      id
      state
    }
    ... on PaymentStateTransitionError {
      errorCode
      message
      transitionError
      fromState
      toState
    }
  }
}

# Advance a fulfillment to the next valid state (e.g. Pending → Shipped).
mutation TransitionFulfillmentToState($id: ID!, $state: String!) {
  transitionFulfillmentToState(id: $id, state: $state) {
    ... on Fulfillment {
      id
      state
    }
    ... on FulfillmentStateTransitionError {
      errorCode
      message
      transitionError
      fromState
      toState
    }
  }
}

# Apply changes to an order (adjust line quantities, add surcharges, etc.).
# Use `dryRun: true` to preview the impact without persisting.
mutation ModifyOrder($input: ModifyOrderInput!) {
  modifyOrder(input: $input) {
    ... on Order {
      id
      state
      total
      totalWithTax
      lines {
        id
        quantity
        linePrice
        linePriceWithTax
      }
    }
    ... on NoChangesSpecifiedError {
      errorCode
      message
    }
    ... on OrderModificationStateError {
      errorCode
      message
    }
    ... on PaymentMethodMissingError {
      errorCode
      message
    }
    ... on RefundPaymentIdMissingError {
      errorCode
      message
    }
    ... on OrderLimitError {
      errorCode
      message
      maxItems
    }
    ... on NegativeQuantityError {
      errorCode
      message
    }
    ... on InsufficientStockError {
      errorCode
      message
    }
    ... on CouponCodeExpiredError {
      errorCode
      message
      couponCode
    }
    ... on CouponCodeInvalidError {
      errorCode
      message
      couponCode
    }
    ... on CouponCodeLimitError {
      errorCode
      message
      couponCode
      limit
    }
    ... on IneligibleShippingMethodError {
      errorCode
      message
    }
  }
}

# Query: list available payment methods (for the manual-payment selector).
query AdminPaymentMethodsForOrder {
  paymentMethods(options: { take: 100, filter: { enabled: { eq: true } } }) {
    items {
      id
      code
      name
      enabled
    }
  }
}
