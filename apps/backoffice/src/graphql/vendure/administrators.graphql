# Vendure Admin API - Administrator Operations

# Get list of administrators
query AdminAdministrators($options: AdministratorListOptions) {
  administrators(options: $options) {
    items {
      id
      createdAt
      updatedAt
      firstName
      lastName
      emailAddress
      user {
        id
        verified
        lastLogin
        roles {
          id
          code
          description
          permissions
        }
      }
    }
    totalItems
  }
}

# Get single administrator by ID
query AdminAdministrator($id: ID!) {
  administrator(id: $id) {
    id
    createdAt
    updatedAt
    firstName
    lastName
    emailAddress
    user {
      id
      verified
      lastLogin
      roles {
        id
        code
        description
        permissions
      }
    }
  }
}

# Get list of roles
query AdminRoles($options: RoleListOptions) {
  roles(options: $options) {
    items {
      id
      createdAt
      updatedAt
      code
      description
      permissions
      channels {
        id
        code
      }
    }
    totalItems
  }
}

# Get single role by ID
query AdminRole($id: ID!) {
  role(id: $id) {
    id
    createdAt
    updatedAt
    code
    description
    permissions
    channels {
      id
      code
    }
  }
}

# Create a new administrator
mutation CreateAdministrator($input: CreateAdministratorInput!) {
  createAdministrator(input: $input) {
    id
    firstName
    lastName
    emailAddress
    user {
      id
      roles {
        id
        code
      }
    }
  }
}

# Update an existing administrator
mutation UpdateAdministrator($input: UpdateAdministratorInput!) {
  updateAdministrator(input: $input) {
    id
    firstName
    lastName
    emailAddress
    user {
      id
      roles {
        id
        code
      }
    }
  }
}

# Delete an administrator
mutation DeleteAdministrator($id: ID!) {
  deleteAdministrator(id: $id) {
    result
    message
  }
}

# Create a new role
mutation CreateRole($input: CreateRoleInput!) {
  createRole(input: $input) {
    id
    code
    description
    permissions
  }
}

# Update an existing role
mutation UpdateRole($input: UpdateRoleInput!) {
  updateRole(input: $input) {
    id
    code
    description
    permissions
  }
}

# Delete a role
mutation DeleteRole($id: ID!) {
  deleteRole(id: $id) {
    result
    message
  }
}

# Bulk delete
mutation DeleteAdministrators($ids: [ID!]!) {
  deleteAdministrators(ids: $ids) {
    result
    message
  }
}

mutation DeleteRoles($ids: [ID!]!) {
  deleteRoles(ids: $ids) {
    result
    message
  }
}
