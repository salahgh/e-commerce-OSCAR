# ==================== OPTION GROUP MUTATIONS ====================

# Create a new product option group
mutation CreateProductOptionGroup($input: CreateProductOptionGroupInput!) {
  createProductOptionGroup(input: $input) {
    id
    code
    name
    options {
      id
      code
      name
    }
  }
}

# Update a product option group
mutation UpdateProductOptionGroup($input: UpdateProductOptionGroupInput!) {
  updateProductOptionGroup(input: $input) {
    id
    code
    name
    options {
      id
      code
      name
    }
  }
}

# Create a new option within an option group
mutation CreateProductOption($input: CreateProductOptionInput!) {
  createProductOption(input: $input) {
    id
    code
    name
    group {
      id
      code
      name
    }
  }
}

# Update a product option
mutation UpdateProductOption($input: UpdateProductOptionInput!) {
  updateProductOption(input: $input) {
    id
    code
    name
    group {
      id
      code
      name
    }
  }
}

# Delete a product option
mutation DeleteProductOption($id: ID!) {
  deleteProductOption(id: $id) {
    result
    message
  }
}

# Add an option group to a product
mutation AddOptionGroupToProduct($productId: ID!, $optionGroupId: ID!) {
  addOptionGroupToProduct(productId: $productId, optionGroupId: $optionGroupId) {
    id
    optionGroups {
      id
      code
      name
      options {
        id
        code
        name
      }
    }
  }
}

# Remove an option group from a product
mutation RemoveOptionGroupFromProduct($productId: ID!, $optionGroupId: ID!, $force: Boolean) {
  removeOptionGroupFromProduct(productId: $productId, optionGroupId: $optionGroupId, force: $force) {
    ... on Product {
      id
      optionGroups {
        id
        code
        name
      }
    }
    ... on ProductOptionInUseError {
      errorCode
      message
      optionGroupCode
      productVariantCount
    }
  }
}

# ==================== PRODUCT ASSET MUTATIONS ====================
# Note: General asset mutations (CreateAssets, UpdateAsset, DeleteAsset, DeleteAssets)
# are defined in assets.graphql. These are product-specific asset operations.

# Add assets to product (update product's assetIds)
mutation AddAssetsToProduct($productId: ID!, $assetIds: [ID!]!) {
  updateProduct(input: { id: $productId, assetIds: $assetIds }) {
    id
    assets {
      id
      name
      preview
      source
    }
  }
}

# Set featured asset for product
mutation SetProductFeaturedAsset($productId: ID!, $assetId: ID!) {
  updateProduct(input: { id: $productId, featuredAssetId: $assetId }) {
    id
    featuredAsset {
      id
      name
      preview
      source
    }
  }
}

# Set featured asset for variant
mutation SetVariantFeaturedAsset($variantId: ID!, $assetId: ID!) {
  updateProductVariants(input: [{ id: $variantId, featuredAssetId: $assetId }]) {
    id
    featuredAsset {
      id
      preview
    }
  }
}

# Add assets to variant
mutation AddAssetsToVariant($variantId: ID!, $assetIds: [ID!]!) {
  updateProductVariants(input: [{ id: $variantId, assetIds: $assetIds }]) {
    id
    assets {
      id
      preview
      source
    }
  }
}

# ==================== CHANNEL MUTATIONS ====================

# Assign products to channel
mutation AssignProductsToChannel($input: AssignProductsToChannelInput!) {
  assignProductsToChannel(input: $input) {
    id
  }
}

# Remove products from channel
mutation RemoveProductsFromChannel($input: RemoveProductsFromChannelInput!) {
  removeProductsFromChannel(input: $input) {
    id
  }
}

# ==================== FACET MUTATIONS ====================

# Assign facet values to product
mutation UpdateProductFacets($productId: ID!, $facetValueIds: [ID!]!) {
  updateProduct(input: { id: $productId, facetValueIds: $facetValueIds }) {
    id
    facetValues {
      id
      name
      facet {
        id
        name
      }
    }
  }
}

# ==================== STOCK MUTATIONS ====================

# Update stock for a single variant
mutation UpdateVariantStock($variantId: ID!, $stockOnHand: Int!) {
  updateProductVariants(input: [{ id: $variantId, stockOnHand: $stockOnHand }]) {
    id
    stockOnHand
    stockAllocated
  }
}

# Update stock for multiple variants
mutation UpdateVariantsStock($input: [UpdateProductVariantInput!]!) {
  updateProductVariants(input: $input) {
    id
    sku
    stockOnHand
    stockAllocated
  }
}

