# Vendure Admin API - Comprehensive Product Operations

# ==================== QUERIES ====================


# List all products with filtering and pagination
query AdminProducts($options: ProductListOptions) {
  products(options: $options) {
    items {
      id
      createdAt
      updatedAt
      name
      slug
      description
      enabled
      featuredAsset {
        id
        name
        preview
        source
      }
      assets {
        id
        name
        preview
        source
      }
      variants {
        id
        name
        sku
        price
        priceWithTax
        stockOnHand
        stockAllocated
        enabled
        options {
          id
          code
          name
        }
        facetValues {
          id
          name
          code
          facet {
            id
            name
            code
          }
        }
        customFields {
          minStockAlert
          originalPrice
          discountPercent
        }
      }
      optionGroups {
        id
        code
        name
        options {
          id
          code
          name
        }
      }
      facetValues {
        id
        name
        code
        facet {
          id
          name
          code
        }
      }
      collections {
        id
        name
        slug
        parent {
          id
          name
        }
      }
      translations {
        languageCode
        name
        slug
        description
      }
    }
    totalItems
  }
}

# Get single product with full details
query AdminProduct($id: ID!) {
  product(id: $id) {
    id
    createdAt
    updatedAt
    name
    slug
    description
    enabled
    featuredAsset {
      id
      name
      preview
      source
      width
      height
      fileSize
      mimeType
    }
    assets {
      id
      name
      preview
      source
      width
      height
      fileSize
      mimeType
    }
    optionGroups {
      id
      code
      name
      options {
        id
        code
        name
      }
    }
    variants {
      id
      createdAt
      updatedAt
      name
      sku
      price
      priceWithTax
      stockOnHand
      stockAllocated
      enabled
      trackInventory
      featuredAsset {
        id
        preview
        source
      }
      assets {
        id
        preview
        source
      }
      options {
        id
        code
        name
        group {
          id
          code
          name
        }
      }
      customFields {
        minStockAlert
        originalPrice
        discountPercent
      }
    }
    translations {
      languageCode
      name
      slug
      description
    }
    collections {
      id
      name
      slug
    }
    facetValues {
      id
      name
      code
      facet {
        id
        name
        code
      }
    }
    channels {
      id
      code
      defaultLanguageCode
      defaultCurrencyCode
    }
  }
}

# Get all product option groups (returns array directly, optional filterTerm)
query AdminProductOptionGroups($filterTerm: String) {
  productOptionGroups(filterTerm: $filterTerm) {
    id
    createdAt
    name
    code
    options {
      id
      code
      name
    }
  }
}

# Get all facets for product categorization
query AdminFacets($options: FacetListOptions) {
  facets(options: $options) {
    items {
      id
      name
      code
      values {
        id
        name
        code
      }
    }
    totalItems
  }
}

# Get facets with full values for faceted filtering
query AdminFacetsWithValues($options: FacetListOptions) {
  facets(options: $options) {
    items {
      id
      name
      code
      isPrivate
      values {
        id
        name
        code
      }
    }
    totalItems
  }
}

# Search products with faceted filtering (admin version)
# This query uses Vendure's full-text search which searches both product name AND SKU
query AdminSearchProducts($input: SearchInput!) {
  search(input: $input) {
    items {
      productId
      productName
      productVariantId
      productVariantName
      sku
      slug
      description
      enabled
      inStock
      score
      productAsset {
        id
        preview
        focalPoint {
          x
          y
        }
      }
      productVariantAsset {
        id
        preview
      }
      price {
        ... on SinglePrice {
          value
        }
        ... on PriceRange {
          min
          max
        }
      }
      priceWithTax {
        ... on SinglePrice {
          value
        }
        ... on PriceRange {
          min
          max
        }
      }
      currencyCode
      channelIds
      collectionIds
      facetIds
      facetValueIds
    }
    totalItems
    facetValues {
      facetValue {
        id
        name
        code
        facet {
          id
          name
          code
        }
      }
      count
    }
    collections {
      collection {
        id
        name
        slug
      }
      count
    }
  }
}

# Get tax categories for variant pricing
query AdminTaxCategories {
  taxCategories {
    items {
      id
      name
      isDefault
    }
    totalItems
  }
}

# ==================== PRODUCT MUTATIONS ====================

# Create a new product
mutation CreateProduct($input: CreateProductInput!) {
  createProduct(input: $input) {
    id
    name
    slug
    description
    enabled
    featuredAsset {
      id
      preview
    }
    assets {
      id
      preview
    }
    optionGroups {
      id
      code
      name
      options {
        id
        code
        name
      }
    }
    translations {
      languageCode
      name
      slug
      description
    }
  }
}

# Update an existing product
mutation UpdateProduct($input: UpdateProductInput!) {
  updateProduct(input: $input) {
    id
    name
    slug
    description
    enabled
    featuredAsset {
      id
      preview
    }
    assets {
      id
      preview
    }
    optionGroups {
      id
      code
      name
      options {
        id
        code
        name
      }
    }
    translations {
      languageCode
      name
      slug
      description
    }
  }
}

# Delete a single product
mutation DeleteProduct($id: ID!) {
  deleteProduct(id: $id) {
    result
    message
  }
}

# Delete multiple products
mutation DeleteProducts($ids: [ID!]!) {
  deleteProducts(ids: $ids) {
    result
    message
  }
}

