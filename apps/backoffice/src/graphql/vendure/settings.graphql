# Zones — full CRUD + member management
mutation CreateZone($input: CreateZoneInput!) {
  createZone(input: $input) {
    id
    name
  }
}

mutation UpdateZone($input: UpdateZoneInput!) {
  updateZone(input: $input) {
    id
    name
  }
}

mutation DeleteZone($id: ID!) {
  deleteZone(id: $id) {
    result
    message
  }
}

mutation AddMembersToZone($zoneId: ID!, $memberIds: [ID!]!) {
  addMembersToZone(zoneId: $zoneId, memberIds: $memberIds) {
    id
    name
    members {
      id
      name
      code
    }
  }
}

mutation RemoveMembersFromZone($zoneId: ID!, $memberIds: [ID!]!) {
  removeMembersFromZone(zoneId: $zoneId, memberIds: $memberIds) {
    id
    name
    members {
      id
      name
      code
    }
  }
}

# Countries — read only (for zone member picker)
query AdminCountries($options: CountryListOptions) {
  countries(options: $options) {
    items {
      id
      name
      code
      enabled
    }
    totalItems
  }
}

