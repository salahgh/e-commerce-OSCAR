# Vendure Admin API - Promotion/Promo Code Operations

# Get all promotions with pagination and filtering
query AdminPromotions($options: PromotionListOptions) {
  promotions(options: $options) {
    items {
      id
      createdAt
      updatedAt
      startsAt
      endsAt
      couponCode
      perCustomerUsageLimit
      usageLimit
      name
      description
      enabled
      conditions {
        code
        args {
          name
          value
        }
      }
      actions {
        code
        args {
          name
          value
        }
      }
    }
    totalItems
  }
}

# Get single promotion by ID
query AdminPromotion($id: ID!) {
  promotion(id: $id) {
    id
    createdAt
    updatedAt
    startsAt
    endsAt
    couponCode
    perCustomerUsageLimit
    usageLimit
    name
    description
    enabled
    conditions {
      code
      args {
        name
        value
      }
    }
    actions {
      code
      args {
        name
        value
      }
    }
  }
}

# Get available promotion conditions (for form)
query PromotionConditions {
  promotionConditions {
    code
    description
    args {
      name
      type
      required
      defaultValue
      list
      ui
      label
    }
  }
}

# Get available promotion actions (for form)
query PromotionActions {
  promotionActions {
    code
    description
    args {
      name
      type
      required
      defaultValue
      list
      ui
      label
    }
  }
}

# Create new promotion
mutation CreatePromotion($input: CreatePromotionInput!) {
  createPromotion(input: $input) {
    ... on Promotion {
      id
      name
      couponCode
      enabled
      startsAt
      endsAt
    }
    ... on MissingConditionsError {
      errorCode
      message
    }
  }
}

# Update existing promotion
mutation UpdatePromotion($input: UpdatePromotionInput!) {
  updatePromotion(input: $input) {
    ... on Promotion {
      id
      name
      couponCode
      enabled
      startsAt
      endsAt
    }
    ... on MissingConditionsError {
      errorCode
      message
    }
  }
}

# Delete promotion
mutation DeletePromotion($id: ID!) {
  deletePromotion(id: $id) {
    result
    message
  }
}

# Delete multiple promotions
mutation DeletePromotions($ids: [ID!]!) {
  deletePromotions(ids: $ids) {
    result
    message
  }
}

# Channel scoping (no-op in single-channel deployments; available for future
# multi-channel rollouts).
mutation AssignPromotionsToChannel($input: AssignPromotionsToChannelInput!) {
  assignPromotionsToChannel(input: $input) {
    id
    name
  }
}

mutation RemovePromotionsFromChannel($input: RemovePromotionsFromChannelInput!) {
  removePromotionsFromChannel(input: $input) {
    id
    name
  }
}
