# Query single facet with full details
query AdminFacet($id: ID!) {
  facet(id: $id) {
    id
    createdAt
    updatedAt
    name
    code
    isPrivate
    translations {
      id
      languageCode
      name
    }
    values {
      id
      name
      code
      translations {
        id
        languageCode
        name
      }
      facet {
        id
        name
        code
      }
      customFields {
        colorHex
      }
    }
  }
}

# Query facets list with pagination and filtering
query AdminFacetList($options: FacetListOptions) {
  facets(options: $options) {
    items {
      id
      createdAt
      updatedAt
      name
      code
      isPrivate
      translations {
        id
        languageCode
        name
      }
      values {
        id
        name
        code
        translations {
          id
          languageCode
          name
        }
        customFields {
          colorHex
        }
      }
    }
    totalItems
  }
}

# Create a new facet
mutation CreateFacet($input: CreateFacetInput!) {
  createFacet(input: $input) {
    id
    name
    code
    isPrivate
    translations {
      id
      languageCode
      name
    }
    values {
      id
      name
      code
    }
  }
}

# Update an existing facet
mutation UpdateFacet($input: UpdateFacetInput!) {
  updateFacet(input: $input) {
    id
    name
    code
    isPrivate
    translations {
      id
      languageCode
      name
    }
    values {
      id
      name
      code
    }
  }
}

# Delete a facet
mutation DeleteFacet($id: ID!, $force: Boolean) {
  deleteFacet(id: $id, force: $force) {
    result
    message
  }
}

# Create new facet values
mutation CreateFacetValues($input: [CreateFacetValueInput!]!) {
  createFacetValues(input: $input) {
    id
    name
    code
    translations {
      id
      languageCode
      name
    }
    facet {
      id
      name
    }
    customFields {
      colorHex
    }
  }
}

# Update existing facet values
mutation UpdateFacetValues($input: [UpdateFacetValueInput!]!) {
  updateFacetValues(input: $input) {
    id
    name
    code
    translations {
      id
      languageCode
      name
    }
    customFields {
      colorHex
    }
  }
}

# Delete facet values
mutation DeleteFacetValues($ids: [ID!]!, $force: Boolean) {
  deleteFacetValues(ids: $ids, force: $force) {
    result
    message
  }
}

# Assign facets to channels (multi-channel administration).
# Facet has no `channels` field on the entity itself — Vendure scopes
# channel visibility via the `vendure-token` request header, so this
# mutation returns the bare identity only.
mutation AssignFacetsToChannel($input: AssignFacetsToChannelInput!) {
  assignFacetsToChannel(input: $input) {
    id
    name
    code
  }
}

# Remove facets from a channel. Returns a union: success returns Facet,
# failure returns FacetInUseError with usage counts.
mutation RemoveFacetsFromChannel($input: RemoveFacetsFromChannelInput!) {
  removeFacetsFromChannel(input: $input) {
    ... on Facet {
      id
      name
      code
    }
    ... on FacetInUseError {
      errorCode
      message
      facetCode
      productCount
      variantCount
    }
  }
}
