# Vendure Admin API - Reports Operations

# Get orders for date range with totals for sales reports
query SalesReportOrders($options: OrderListOptions) {
  orders(options: $options) {
    items {
      id
      code
      state
      total
      totalWithTax
      currencyCode
      orderPlacedAt
      createdAt
      customer {
        id
        firstName
        lastName
        emailAddress
        createdAt
        orders {
          totalItems
        }
        customFields {
          wilaya
        }
      }
      lines {
        id
        productVariant {
          id
          sku
          name
          product {
            id
            name
            facetValues {
              id
              name
              facet {
                id
                name
                code
              }
            }
          }
        }
        quantity
        linePrice
        linePriceWithTax
      }
      customFields {
        wilaya
      }
    }
    totalItems
  }
}

# Get top selling products
query TopSellingProducts($options: ProductListOptions) {
  products(options: $options) {
    items {
      id
      name
      slug
      featuredAsset {
        id
        preview
      }
      variants {
        id
        sku
        name
        price
        stockOnHand
        stockAllocated
      }
      customFields {
        nameFr
        viewCount
        isFeatured
      }
    }
    totalItems
  }
}

# Get products with low stock
query LowStockVariants($options: ProductVariantListOptions) {
  productVariants(options: $options) {
    items {
      id
      sku
      name
      price
      stockOnHand
      stockAllocated
      product {
        id
        name
        featuredAsset {
          id
          preview
        }
      }
      customFields {
        minStockAlert
      }
    }
    totalItems
  }
}

# Get customers for growth analysis
query CustomersReport($options: CustomerListOptions) {
  customers(options: $options) {
    items {
      id
      firstName
      lastName
      emailAddress
      createdAt
      orders {
        totalItems
        items {
          id
          totalWithTax
          orderPlacedAt
          state
        }
      }
      customFields {
        wilaya
      }
    }
    totalItems
  }
}

# Get all customers count for new vs returning analysis
query AllCustomersCount {
  customers(options: { take: 0 }) {
    totalItems
  }
}

# Get all product variants for stock overview
query StockOverview($options: ProductVariantListOptions) {
  productVariants(options: $options) {
    items {
      id
      sku
      name
      price
      stockOnHand
      stockAllocated
      enabled
      product {
        id
        name
        enabled
        featuredAsset {
          id
          preview
        }
        facetValues {
          id
          name
          facet {
            id
            name
            code
          }
        }
      }
      customFields {
        minStockAlert
      }
    }
    totalItems
  }
}

# Get stock movements for a variant
query StockMovements($variantId: ID!, $options: StockMovementListOptions) {
  productVariant(id: $variantId) {
    id
    name
    stockMovements(options: $options) {
      totalItems
      items {
        ... on StockMovement {
          id
          createdAt
          quantity
          type
        }
        ... on StockAdjustment {
          id
          createdAt
          quantity
          type
        }
        ... on Allocation {
          id
          createdAt
          quantity
          type
          orderLine {
            id
            order {
              id
              code
            }
          }
        }
        ... on Sale {
          id
          createdAt
          quantity
          type
        }
        ... on Cancellation {
          id
          createdAt
          quantity
          type
          orderLine {
            id
            order {
              id
              code
            }
          }
        }
        ... on Release {
          id
          createdAt
          quantity
          type
        }
      }
    }
  }
}

# Get categories for category filter in reports
query CategoriesForReport {
  collections(options: { take: 100 }) {
    items {
      id
      name
      slug
      productVariants {
        totalItems
      }
    }
    totalItems
  }
}
