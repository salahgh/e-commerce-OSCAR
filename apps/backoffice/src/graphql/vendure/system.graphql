# Vendure Admin API - System Operations (Search Index & Job Management)

# Trigger a full search index rebuild
mutation Reindex {
  reindex {
    id
    state
    progress
    queueName
    createdAt
    startedAt
    settledAt
    isSettled
    duration
    error
  }
}

# Get a single job by ID (for polling progress)
query GetJob($jobId: ID!) {
  job(jobId: $jobId) {
    id
    state
    progress
    queueName
    duration
    result
    error
    isSettled
    createdAt
    startedAt
    settledAt
  }
}

# Get list of jobs with filtering (for job history)
query GetJobs($options: JobListOptions) {
  jobs(options: $options) {
    items {
      id
      state
      progress
      queueName
      createdAt
      startedAt
      settledAt
      duration
      isSettled
      error
    }
    totalItems
  }
}

# Run pending search index updates (for incremental updates)
mutation RunPendingSearchIndexUpdates {
  runPendingSearchIndexUpdates {
    success
  }
}

# Cancel a running job
mutation CancelJob($jobId: ID!) {
  cancelJob(jobId: $jobId) {
    id
    state
    isSettled
  }
}

# Get job queue status
query GetJobQueues {
  jobQueues {
    name
    running
  }
}

# List available entity duplicators (used by Collection / Product / Facet duplicate UI)
query EntityDuplicators {
  entityDuplicators {
    code
    description
    forEntities
    requiresPermission
    args {
      name
      type
      label
      description
      defaultValue
      ui
    }
  }
}

# Generic duplicate entity mutation — reused across collections, products, facets
mutation DuplicateEntity($input: DuplicateEntityInput!) {
  duplicateEntity(input: $input) {
    ... on DuplicateEntitySuccess {
      newEntityId
    }
    ... on DuplicateEntityError {
      errorCode
      message
      duplicationError
    }
  }
}

# List channels for multi-channel administration
query AdminChannels($options: ChannelListOptions) {
  channels(options: $options) {
    items {
      id
      code
      token
      defaultLanguageCode
      availableLanguageCodes
      defaultCurrencyCode
      pricesIncludeTax
    }
    totalItems
  }
}
