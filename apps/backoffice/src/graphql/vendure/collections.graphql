# Vendure Admin API - Collection (Category) Operations

# NOTE: no `productVariants { totalItems }` here on purpose — Vendure resolves
# it with a full variant list query PER collection (~5.6 s for 64 collections
# in production). Pages that show counts merge AdminCollectionVariantCounts.
query AdminCollections($options: CollectionListOptions) {
  collections(options: $options) {
    items {
      id
      createdAt
      updatedAt
      name
      slug
      description
      isPrivate
      position
      parentId
      breadcrumbs {
        id
        name
        slug
      }
      featuredAsset {
        id
        preview
        source
      }
      translations {
        languageCode
        name
        slug
        description
      }
      customFields {
        displayOrder
      }
    }
    totalItems
  }
}

query AdminCollection($id: ID!) {
  collection(id: $id) {
    id
    createdAt
    updatedAt
    name
    slug
    description
    isPrivate
    position
    parentId
    inheritFilters
    breadcrumbs {
      id
      name
      slug
    }
    featuredAsset {
      id
      preview
      source
    }
    assets {
      id
      name
      preview
      source
    }
    productVariants {
      totalItems
    }
    translations {
      languageCode
      name
      slug
      description
    }
    customFields {
      displayOrder
    }
    filters {
      code
      args {
        name
        value
      }
    }
    children {
      id
      name
      slug
      position
      productVariants {
        totalItems
      }
      translations {
        languageCode
        name
      }
    }
  }
}

mutation CreateCollection($input: CreateCollectionInput!) {
  createCollection(input: $input) {
    id
    name
    slug
    description
    isPrivate
    position
    parentId
    inheritFilters
    translations {
      languageCode
      name
      slug
      description
    }
    customFields {
      displayOrder
    }
  }
}

mutation UpdateCollection($input: UpdateCollectionInput!) {
  updateCollection(input: $input) {
    id
    name
    slug
    description
    isPrivate
    position
    parentId
    inheritFilters
    translations {
      languageCode
      name
      slug
      description
    }
    customFields {
      displayOrder
    }
  }
}

mutation DeleteCollection($id: ID!) {
  deleteCollection(id: $id) {
    result
    message
  }
}

# Bulk delete multiple collections
mutation DeleteCollections($ids: [ID!]!) {
  deleteCollections(ids: $ids) {
    result
    message
  }
}

mutation MoveCollection($input: MoveCollectionInput!) {
  moveCollection(input: $input) {
    id
    name
    slug
    position
    parentId
  }
}

# Assign collections to channels (multi-channel administration).
# Collection has no `channels` field on the entity itself — Vendure scopes
# channel visibility via the `vendure-token` request header, so this mutation
# returns the bare identity only and the UI reflects assignment via toast.
mutation AssignCollectionsToChannel($input: AssignCollectionsToChannelInput!) {
  assignCollectionsToChannel(input: $input) {
    id
    name
  }
}

# Remove collections from channels
mutation RemoveCollectionsFromChannel($input: RemoveCollectionsFromChannelInput!) {
  removeCollectionsFromChannel(input: $input) {
    id
    name
  }
}

# Update collection filters (for assigning products to collections)
mutation UpdateCollectionFilters($id: ID!, $filters: [ConfigurableOperationInput!]!) {
  updateCollection(input: { id: $id, filters: $filters }) {
    id
    name
    filters {
      code
      args {
        name
        value
      }
    }
  }
}

# Get all collections with their filters (for product-collection management)
# Variant count per collection, one grouped SQL statement server-side.
query AdminCollectionVariantCounts {
  collectionVariantCounts {
    collectionId
    count
  }
}

# Lean list for filter sidebars (products page). The full AdminCollections
# query resolves breadcrumbs and a variant count per collection, which took
# ~7 s for 100 collections on the production server.
query AdminCollectionsLite($options: CollectionListOptions) {
  collections(options: $options) {
    items {
      id
      name
      slug
      parentId
      position
    }
    totalItems
  }
}

query AdminCollectionsWithFilters($options: CollectionListOptions) {
  collections(options: $options) {
    items {
      id
      name
      slug
      parentId
      isPrivate
      filters {
        code
        args {
          name
          value
        }
      }
    }
    totalItems
  }
}

# Get available collection filter definitions
query CollectionFilterDefinitions {
  collectionFilters {
    code
    description
    args {
      name
      type
      required
      defaultValue
      ui
      label
      description
    }
  }
}

# Preview collection products before saving filters
query PreviewCollectionProducts($input: PreviewCollectionVariantsInput!, $options: ProductVariantListOptions) {
  previewCollectionVariants(input: $input, options: $options) {
    items {
      id
      name
      sku
      product {
        id
        name
        featuredAsset {
          preview
        }
      }
    }
    totalItems
  }
}

# Get all facets with their values (for filter builder)
query AdminFacetsForFilter {
  facets {
    items {
      id
      name
      code
      values {
        id
        name
        code
      }
    }
    totalItems
  }
}
