# Order Mutations

mutation CreateOrder($input: CreateOrderRequestInput!) {
  createOrder(input: $input) {
    id
    orderNumber
    userId
    userEmail
    status
    subtotal
    shippingCost
    totalAmount
    paymentMethod
    shippingAddress
    phoneNumber
    notes
    items {
      id
      productId
      productName
      productImage
      quantity
      price
      subtotal
      selectedSize
      selectedColor
    }
    createdAt
    updatedAt
  }
}

mutation CancelOrder($id: Long!) {
  cancelOrder(id: $id) {
    id
    orderNumber
    status
    updatedAt
  }
}
