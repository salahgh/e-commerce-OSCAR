query SearchProducts($keyword: String!, $page: Int, $size: Int) {
  searchProducts(keyword: $keyword, page: $page, size: $size) {
    content {
      id
      sku
      nameAr
      nameFr
      nameEn
      basePrice
      salePrice
      stockQuantity
      imageUrls
      categoryId
      categoryName
      isFeatured
    }
    totalElements
    totalPages
  }
}

query GetProductsByCategory($categoryId: Long!, $page: Int, $size: Int) {
