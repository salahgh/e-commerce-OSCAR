# Product Queries

query GetProducts($page: Int, $size: Int, $sortBy: String, $sortDirection: String) {
  products(page: $page, size: $size, sortBy: $sortBy, sortDirection: $sortDirection) {
    content {
      id
      sku
      nameAr
      nameFr
      nameEn
      descriptionAr
      descriptionFr
      descriptionEn
      basePrice
      salePrice
      stockQuantity
      imageUrls
      categoryId
      categoryName
      isFeatured
      availableSizes
      availableColors
      viewCount
      createdAt
      updatedAt
    }
    totalElements
    totalPages
    number
    size
    first
    last
    hasNext
    hasPrevious
  }
}

query GetProduct($id: Long!) {
  product(id: $id) {
    id
    sku
    nameAr
    nameFr
    nameEn
    descriptionAr
    descriptionFr
    descriptionEn
    basePrice
    salePrice
    stockQuantity
    imageUrls
    categoryId
    categoryName
    isFeatured
    availableSizes
    availableColors
    viewCount
    createdAt
    updatedAt
  }
}

query GetProductBySku($sku: String!) {
