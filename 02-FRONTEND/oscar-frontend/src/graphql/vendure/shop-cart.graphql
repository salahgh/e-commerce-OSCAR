# Vendure Shop API - Cart/Order Operations

fragment OrderLineFields on OrderLine {
  id
  quantity
  linePriceWithTax
  unitPriceWithTax
  productVariant {
    id
    name
    sku
    priceWithTax
    product {
      id
      name
      slug
      featuredAsset {
        id
        preview
      }
    }
  }
  featuredAsset {
    id
    preview
  }
}

fragment OrderFields on Order {
  id
  code
  state
  active
  totalQuantity
  subTotalWithTax
  shippingWithTax
  totalWithTax
  currencyCode
  lines {
    ...OrderLineFields
  }
  shippingAddress {
    fullName
    streetLine1
    streetLine2
    city
    province
    postalCode
    country
    phoneNumber
  }
  billingAddress {
    fullName
    streetLine1
    streetLine2
    city
    province
    postalCode
    country
    phoneNumber
  }
  customer {
    id
    firstName
    lastName
    emailAddress
  }
}

# Get active order (cart)
query GetActiveOrder {
  activeOrder {
    ...OrderFields
  }
}

# Add item to cart
mutation AddItemToOrder($productVariantId: ID!, $quantity: Int!) {
  addItemToOrder(productVariantId: $productVariantId, quantity: $quantity) {
    ... on Order {
      ...OrderFields
    }
    ... on OrderModificationError {
      errorCode
      message
    }
    ... on OrderLimitError {
      errorCode
      message
      maxItems
    }
    ... on NegativeQuantityError {
      errorCode
      message
    }
    ... on InsufficientStockError {
      errorCode
      message
      quantityAvailable
      order {
        ...OrderFields
      }
    }
  }
}

# Update order line quantity
mutation AdjustOrderLine($orderLineId: ID!, $quantity: Int!) {
  adjustOrderLine(orderLineId: $orderLineId, quantity: $quantity) {
    ... on Order {
      ...OrderFields
    }
    ... on OrderModificationError {
      errorCode
      message
    }
    ... on OrderLimitError {
      errorCode
      message
      maxItems
    }
    ... on NegativeQuantityError {
      errorCode
      message
    }
    ... on InsufficientStockError {
      errorCode
      message
      quantityAvailable
      order {
        ...OrderFields
      }
    }
  }
}

# Remove order line
mutation RemoveOrderLine($orderLineId: ID!) {
  removeOrderLine(orderLineId: $orderLineId) {
    ... on Order {
      ...OrderFields
    }
    ... on OrderModificationError {
      errorCode
      message
    }
  }
}

# Remove all order lines (clear cart)
mutation RemoveAllOrderLines {
  removeAllOrderLines {
    ... on Order {
      ...OrderFields
    }
    ... on OrderModificationError {
      errorCode
      message
    }
  }
}

# Set customer for order (guest checkout)
mutation SetCustomerForOrder($input: CreateCustomerInput!) {
  setCustomerForOrder(input: $input) {
    ... on Order {
      ...OrderFields
    }
    ... on AlreadyLoggedInError {
      errorCode
      message
    }
    ... on EmailAddressConflictError {
      errorCode
      message
    }
    ... on GuestCheckoutError {
      errorCode
      message
    }
    ... on NoActiveOrderError {
      errorCode
      message
    }
  }
}

# Set shipping address
mutation SetOrderShippingAddress($input: CreateAddressInput!) {
  setOrderShippingAddress(input: $input) {
    ... on Order {
      ...OrderFields
    }
    ... on NoActiveOrderError {
      errorCode
      message
    }
  }
}

# Set billing address
mutation SetOrderBillingAddress($input: CreateAddressInput!) {
  setOrderBillingAddress(input: $input) {
    ... on Order {
      ...OrderFields
    }
    ... on NoActiveOrderError {
      errorCode
      message
    }
  }
}

# Get eligible shipping methods
query GetEligibleShippingMethods {
  eligibleShippingMethods {
    id
    name
    description
    price
    priceWithTax
    metadata
  }
}

# Set shipping method
mutation SetOrderShippingMethod($shippingMethodId: [ID!]!) {
  setOrderShippingMethod(shippingMethodId: $shippingMethodId) {
    ... on Order {
      ...OrderFields
      shippingLines {
        shippingMethod {
          id
          name
        }
        priceWithTax
      }
    }
    ... on OrderModificationError {
      errorCode
      message
    }
    ... on IneligibleShippingMethodError {
      errorCode
      message
    }
    ... on NoActiveOrderError {
      errorCode
      message
    }
  }
}

# Get eligible payment methods
query GetEligiblePaymentMethods {
  eligiblePaymentMethods {
    id
    name
    code
    description
    isEligible
    eligibilityMessage
  }
}

# Transition to arranging payment
mutation TransitionOrderToState($state: String!) {
  transitionOrderToState(state: $state) {
    ... on Order {
      ...OrderFields
    }
    ... on OrderStateTransitionError {
      errorCode
      message
      transitionError
      fromState
      toState
    }
  }
}

# Add payment
mutation AddPaymentToOrder($input: PaymentInput!) {
  addPaymentToOrder(input: $input) {
    ... on Order {
      ...OrderFields
    }
    ... on OrderPaymentStateError {
      errorCode
      message
    }
    ... on IneligiblePaymentMethodError {
      errorCode
      message
    }
    ... on PaymentFailedError {
      errorCode
      message
      paymentErrorMessage
    }
    ... on PaymentDeclinedError {
      errorCode
      message
      paymentErrorMessage
    }
    ... on OrderStateTransitionError {
      errorCode
      message
      transitionError
      fromState
      toState
    }
    ... on NoActiveOrderError {
      errorCode
      message
    }
  }
}

# Get order by code
query GetOrderByCode($code: String!) {
  orderByCode(code: $code) {
    ...OrderFields
  }
}

# Get customer orders
query GetCustomerOrders($options: OrderListOptions) {
  activeCustomer {
    orders(options: $options) {
      items {
        id
        code
        state
        totalWithTax
        createdAt
        lines {
          id
          quantity
          productVariant {
            name
          }
          featuredAsset {
            preview
          }
        }
      }
      totalItems
    }
  }
}
