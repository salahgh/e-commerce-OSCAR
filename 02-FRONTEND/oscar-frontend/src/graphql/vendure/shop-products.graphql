# Vendure Shop API - Product Operations

fragment AssetFields on Asset {
  id
  preview
  source
  width
  height
  name
}

fragment ProductVariantFields on ProductVariant {
  id
  name
  sku
  priceWithTax
  currencyCode
  stockLevel
  featuredAsset {
    ...AssetFields
  }
  options {
    id
    code
    name
    group {
      id
      code
      name
    }
  }
}

fragment ProductFields on Product {
  id
  name
  slug
  description
  featuredAsset {
    ...AssetFields
  }
  assets {
    ...AssetFields
  }
  variants {
    ...ProductVariantFields
  }
  collections {
    id
    name
    slug
  }
  facetValues {
    id
    name
    code
    facet {
      id
      name
      code
    }
  }
}

fragment CollectionFields on Collection {
  id
  name
  slug
  description
  featuredAsset {
    ...AssetFields
  }
  parent {
    id
    name
    slug
  }
  children {
    id
    name
    slug
  }
  breadcrumbs {
    id
    name
    slug
  }
}

# Get all products with pagination and filters
query GetProducts($options: ProductListOptions) {
  products(options: $options) {
    items {
      ...ProductFields
    }
    totalItems
  }
}

# Get product by slug
query GetProductBySlug($slug: String!) {
  product(slug: $slug) {
    ...ProductFields
  }
}

# Get product by ID
query GetProductById($id: ID!) {
  product(id: $id) {
    ...ProductFields
  }
}

# Search products
query SearchProducts($input: SearchInput!) {
  search(input: $input) {
    items {
      productId
      productName
      slug
      description
      productAsset {
        id
        preview
      }
      priceWithTax {
        ... on SinglePrice {
          value
        }
        ... on PriceRange {
          min
          max
        }
      }
      currencyCode
      collectionIds
      score
    }
    totalItems
    facetValues {
      facetValue {
        id
        name
        code
        facet {
          id
          name
          code
        }
      }
      count
    }
  }
}

# Get all collections
query GetCollections($options: CollectionListOptions) {
  collections(options: $options) {
    items {
      ...CollectionFields
    }
    totalItems
  }
}

# Get collection by slug
query GetCollectionBySlug($slug: String!) {
  collection(slug: $slug) {
    ...CollectionFields
    productVariants {
      items {
        id
        product {
          ...ProductFields
        }
      }
      totalItems
    }
  }
}

# Get collection by ID
query GetCollectionById($id: ID!) {
  collection(id: $id) {
    ...CollectionFields
    productVariants {
      items {
        id
        product {
          ...ProductFields
        }
      }
      totalItems
    }
  }
}

# Get facet values for filtering
query GetFacets {
  facets {
    items {
      id
      name
      code
      values {
        id
        name
        code
      }
    }
    totalItems
  }
}

# Get products by collection
query GetProductsByCollection($collectionSlug: String!, $options: ProductVariantListOptions) {
  collection(slug: $collectionSlug) {
    id
    name
    slug
    productVariants(options: $options) {
      items {
        id
        product {
          ...ProductFields
        }
      }
      totalItems
    }
  }
}
