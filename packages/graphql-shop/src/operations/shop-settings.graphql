# Vendure Shop API - Site content settings (Channel custom fields)
# Per-language text fields (…Ar/…Fr/…En) since Channel is not translatable.
query GetSiteSettings {
  activeChannel {
    id
    customFields {
      promoTextAr
      promoTextFr
      promoTextEn
      freeShippingThreshold
      contactEmail
      contactPhone
      footerAddressAr
      footerAddressFr
      footerAddressEn
      socialFacebook
      socialInstagram
      socialTwitter
      socialLinkedin
      socialYoutube
      appAppStore
      appGooglePlay
      reviewsTitleAr
      reviewsTitleFr
      reviewsTitleEn
      reviewsSubtitleAr
      reviewsSubtitleFr
      reviewsSubtitleEn
      copyrightTextAr
      copyrightTextFr
      copyrightTextEn
      heroImages {
        id
        preview
      }
      bannerImages {
        id
        preview
      }
      reviewImages {
        id
        preview
      }
    }
  }
}
