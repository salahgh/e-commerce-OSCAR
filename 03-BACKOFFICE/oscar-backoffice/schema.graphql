"""Exposes a URL that specifies the behaviour of this scalar."""
directive @specifiedBy(
  """The URL that specifies the behaviour of this scalar."""
  url: String!
) on SCALAR

"""Indicates an Input Object is a OneOf Input Object."""
directive @oneOf on INPUT_OBJECT

input AddToCartRequestInput {
  productId: Long!
  quantity: Int!
  selectedColor: String
  selectedSize: String
}

"""An arbitrary precision signed decimal"""
scalar BigDecimal

type CartItemResponse {
  id: Long
  price: BigDecimal
  productId: Long
  productImage: String
  productName: String
  quantity: Int
  selectedColor: String
  selectedSize: String
  subtotal: BigDecimal
}

type CartResponse {
  createdAt: LocalDateTime
  id: Long
  items: [CartItemResponse]
  totalAmount: BigDecimal
  updatedAt: LocalDateTime
  userId: Long
}

type CategoryResponse {
  """Child categories"""
  children: [CategoryResponse]

  """Creation timestamp"""
  createdAt: LocalDateTime

  """Description in Arabic"""
  descriptionAr: String

  """Description in English"""
  descriptionEn: String

  """Description in French"""
  descriptionFr: String

  """Display order for sorting"""
  displayOrder: Int

  """Category ID"""
  id: Long

  """Category image URL"""
  imageUrl: String

  """Is category active"""
  isActive: Boolean

  """Name in Arabic"""
  nameAr: String

  """Name in English"""
  nameEn: String

  """Name in French"""
  nameFr: String

  """Parent category ID (null if root)"""
  parentId: Long

  """Parent category name"""
  parentName: String

  """Number of products in this category"""
  productCount: Long

  """URL-friendly slug"""
  slug: String

  """Last update timestamp"""
  updatedAt: LocalDateTime
}

input ChangePasswordRequestInput {
  """Current password"""
  currentPassword: String!

  """New password"""
  newPassword: String!
}

input CreateCategoryRequestInput {
  """Description in Arabic"""
  descriptionAr: String

  """Description in English"""
  descriptionEn: String

  """Description in French"""
  descriptionFr: String

  """Display order for sorting"""
  displayOrder: Int

  """Category image URL"""
  imageUrl: String

  """Name in Arabic"""
  nameAr: String!

  """Name in English"""
  nameEn: String

  """Name in French"""
  nameFr: String!

  """Parent category ID (null for root category)"""
  parentId: Long

  """URL-friendly slug (must be unique)"""
  slug: String!
}

input CreateOrderRequestInput {
  notes: String
  paymentMethod: String!
  phoneNumber: String!
  shippingAddress: String!
}

input CreateProductRequestInput {
  availableColors: [String]
  availableSizes: [String]
  basePrice: BigDecimal!
  categoryId: Long!
  descriptionAr: String
  descriptionEn: String
  descriptionFr: String
  imageUrls: [String]
  isFeatured: Boolean
  nameAr: String!
  nameEn: String!
  nameFr: String!
  salePrice: BigDecimal
  sku: String!
  stockQuantity: Int!
}

enum Direction {
  ASC
  DESC
}

"""Built-in scalar representing a local date-time"""
scalar LocalDateTime

input LoginRequestInput {
  email: String!
  password: String!
}

type LoginResponse {
  accessToken: String
  email: String
  expiresIn: Long
  firstName: String
  lastName: String
  refreshToken: String
  role: String
  tokenType: String
  userId: Long
}

"""A 64-bit signed integer"""
scalar Long

"""Mutation root"""
type Mutation {
  """Create order from shopping cart"""
  createOrder(
    """Order details"""
    input: CreateOrderRequestInput
  ): OrderResponse

  """Update cart item quantity"""
  updateCartItem(
    """Updated quantity"""
    input: UpdateCartItemRequestInput

    """Cart item ID"""
    itemId: Long
  ): CartResponse

  """Reset password using reset token"""
  resetPassword(
    """New password"""
    newPassword: String

    """Password reset token"""
    token: String
  ): Boolean

  """Cancel an order"""
  cancelOrder(
    """Order ID"""
    id: Long
  ): OrderResponse

  """Update current user's profile"""
  updateProfile(
    """Profile update details"""
    input: UpdateProfileRequestInput
  ): UserProfileResponse

  """Update a product (Admin only)"""
  updateProduct(
    """Product update details"""
    input: UpdateProductRequestInput

    """Product ID"""
    id: Long
  ): ProductResponse

  """Update a category (Admin only)"""
  updateCategory(
    """Category update details"""
    input: UpdateCategoryRequestInput

    """Category ID"""
    id: Long
  ): CategoryResponse

  """Create a new product (Admin only)"""
  createProduct(
    """Product creation details"""
    input: CreateProductRequestInput
  ): ProductResponse

  """Delete current user's account (soft delete)"""
  deleteMyAccount: Boolean

  """Authenticate user and receive access tokens"""
  login(
    """Login credentials"""
    input: LoginRequestInput
  ): LoginResponse

  """Delete a category (Admin only)"""
  deleteCategory(
    """Category ID"""
    id: Long
  ): Boolean

  """Update order status (Admin only)"""
  updateOrderStatus(
    """Order status update"""
    input: UpdateOrderStatusRequestInput

    """Order ID"""
    id: Long
  ): OrderResponse

  """Change current user's password"""
  changePassword(
    """Password change details"""
    input: ChangePasswordRequestInput
  ): Boolean

  """Remove item from shopping cart"""
  removeFromCart(
    """Cart item ID to remove"""
    itemId: Long
  ): CartResponse

  """Request password reset email"""
  forgotPassword(
    """User email address"""
    email: String
  ): Boolean

  """Add item to shopping cart"""
  addToCart(
    """Item to add to cart"""
    input: AddToCartRequestInput
  ): CartResponse

  """Create a new category (Admin only)"""
  createCategory(
    """Category creation details"""
    input: CreateCategoryRequestInput
  ): CategoryResponse

  """Clear all items from shopping cart"""
  clearCart: Boolean

  """Activate/Deactivate user account (Admin only)"""
  toggleUserStatus(
    """User ID"""
    userId: Long
  ): UserProfileResponse

  """Delete a product (soft delete - Admin only)"""
  deleteProduct(
    """Product ID"""
    id: Long
  ): Boolean

  """Register a new user account"""
  register(
    """User registration details"""
    input: RegisterRequestInput
  ): LoginResponse

  """Refresh access token using refresh token"""
  refreshToken(
    """Refresh token"""
    input: TokenRefreshRequestInput
  ): LoginResponse
}

enum NullHandling {
  NATIVE
  NULLS_FIRST
  NULLS_LAST
}

type Order {
  direction: Direction
  ignoreCase: Boolean
  nullHandlingHint: NullHandling
  property: String!
}

type OrderItemResponse {
  id: Long
  price: BigDecimal
  productId: Long
  productImage: String
  productName: String
  quantity: Int
  selectedColor: String
  selectedSize: String
  subtotal: BigDecimal
}

type OrderResponse {
  createdAt: LocalDateTime
  deliveredAt: LocalDateTime
  id: Long
  items: [OrderItemResponse]
  notes: String
  orderNumber: String
  paidAt: LocalDateTime
  paymentMethod: String
  phoneNumber: String
  shippingAddress: String
  shippingCost: BigDecimal
  status: String
  subtotal: BigDecimal
  totalAmount: BigDecimal
  trackingNumber: String
  updatedAt: LocalDateTime
  userEmail: String
  userId: Long
}

type Page_OrderResponse {
  content: [OrderResponse]
  first: Boolean!
  hasContent: Boolean!
  hasNext: Boolean!
  hasPrevious: Boolean!
  last: Boolean!
  nextOrLastPageable: Pagination
  nextPageable: Pagination
  number: Int!
  numberOfElements: Int!
  pageable: Pagination
  previousOrFirstPageable: Pagination
  previousPageable: Pagination
  size: Int!
  sort: Sorting
  totalElements: Long!
  totalPages: Int!
}

type Page_ProductResponse {
  content: [ProductResponse]
  first: Boolean!
  hasContent: Boolean!
  hasNext: Boolean!
  hasPrevious: Boolean!
  last: Boolean!
  nextOrLastPageable: Pagination
  nextPageable: Pagination
  number: Int!
  numberOfElements: Int!
  pageable: Pagination
  previousOrFirstPageable: Pagination
  previousPageable: Pagination
  size: Int!
  sort: Sorting
  totalElements: Long!
  totalPages: Int!
}

type Page_UserProfileResponse {
  content: [UserProfileResponse]
  first: Boolean!
  hasContent: Boolean!
  hasNext: Boolean!
  hasPrevious: Boolean!
  last: Boolean!
  nextOrLastPageable: Pagination
  nextPageable: Pagination
  number: Int!
  numberOfElements: Int!
  pageable: Pagination
  previousOrFirstPageable: Pagination
  previousPageable: Pagination
  size: Int!
  sort: Sorting
  totalElements: Long!
  totalPages: Int!
}

type Pagination {
  pageNumber: Int!
  pageSize: Int
  sort: Sort
}

type ProductResponse {
  availableColors: [String]
  availableSizes: [String]
  basePrice: BigDecimal
  categoryId: Long
  categoryName: String
  createdAt: LocalDateTime
  descriptionAr: String
  descriptionEn: String
  descriptionFr: String
  id: Long
  imageUrls: [String]
  isFeatured: Boolean
  nameAr: String
  nameEn: String
  nameFr: String
  salePrice: BigDecimal
  sku: String
  stockQuantity: Int
  updatedAt: LocalDateTime
  viewCount: Long
}

"""Query root"""
type Query {
  """Get products by price range"""
  productsByPriceRange(
    """Page size"""
    size: Int = 20

    """Minimum price"""
    minPrice: BigDecimal

    """Page number (0-based)"""
    page: Int = 0

    """Maximum price"""
    maxPrice: BigDecimal
  ): Page_ProductResponse

  """Get current user's orders"""
  myOrders(
    """Page size"""
    size: Int = 10

    """Page number (0-based)"""
    page: Int = 0
  ): Page_OrderResponse

  """Get orders by status (Admin only)"""
  ordersByStatus(
    """Page size"""
    size: Int = 20

    """Page number (0-based)"""
    page: Int = 0

    """Order status"""
    status: String
  ): Page_OrderResponse

  """Get root categories (no parent)"""
  rootCategories: [CategoryResponse]

  """Get all active products with pagination"""
  products(
    """Sort direction (ASC or DESC)"""
    sortDirection: String = "DESC"

    """Page size"""
    size: Int = 20

    """Sort field"""
    sortBy: String = "createdAt"

    """Page number (0-based)"""
    page: Int = 0
  ): Page_ProductResponse

  """Get all active categories"""
  activeCategories: [CategoryResponse]

  """Get new arrivals (sorted by creation date)"""
  newArrivals(
    """Page size"""
    size: Int = 20

    """Page number (0-based)"""
    page: Int = 0
  ): Page_ProductResponse

  """Get products with low stock (Admin only)"""
  lowStockProducts(
    """Stock threshold"""
    threshold: Int = 10
  ): [ProductResponse]

  """Search products by keyword (searches FR/AR/EN names)"""
  searchProducts(
    """Page size"""
    size: Int = 20

    """Page number (0-based)"""
    page: Int = 0

    """Search keyword"""
    keyword: String
  ): Page_ProductResponse

  """Get current authenticated user's profile"""
  me: UserProfileResponse

  """Get all categories (flat list)"""
  categories: [CategoryResponse]

  """Get category tree (hierarchical structure)"""
  categoryTree: [CategoryResponse]

  """Get order by ID"""
  order(
    """Order ID"""
    id: Long
  ): OrderResponse

  """Get product by ID"""
  product(
    """Product ID"""
    id: Long
  ): ProductResponse

  """Get category by slug"""
  categoryBySlug(
    """Category slug"""
    slug: String
  ): CategoryResponse

  """Get current user's shopping cart"""
  myCart: CartResponse

  """Get popular products (sorted by view count)"""
  popularProducts(
    """Page size"""
    size: Int = 20

    """Page number (0-based)"""
    page: Int = 0
  ): Page_ProductResponse

  """Get featured products"""
  featuredProducts: [ProductResponse]

  """Get products by category"""
  productsByCategory(
    """Page size"""
    size: Int = 20

    """Page number (0-based)"""
    page: Int = 0

    """Category ID"""
    categoryId: Long
  ): Page_ProductResponse

  """Get all users (Admin only)"""
  users(
    """Sort direction (ASC or DESC)"""
    sortDirection: String = "DESC"

    """Page size"""
    size: Int = 20

    """Sort field"""
    sortBy: String = "createdAt"

    """Page number (0-based)"""
    page: Int = 0
  ): Page_UserProfileResponse

  """Get users by role (Admin only)"""
  usersByRole(
    """User role (CUSTOMER, ADMIN, SUPER_ADMIN)"""
    role: String

    """Page size"""
    size: Int = 20

    """Page number (0-based)"""
    page: Int = 0
  ): Page_UserProfileResponse

  """Get all orders (Admin only)"""
  allOrders(
    """Page size"""
    size: Int = 20

    """Page number (0-based)"""
    page: Int = 0
  ): Page_OrderResponse

  """Get product by SKU"""
  productBySku(
    """Product SKU"""
    sku: String
  ): ProductResponse

  """Get subcategories of a category"""
  subcategories(
    """Parent category ID"""
    parentId: Long
  ): [CategoryResponse]

  """Get category by ID"""
  category(
    """Category ID"""
    id: Long
  ): CategoryResponse

  """Get user by ID (Admin only)"""
  user(
    """User ID"""
    id: Long
  ): UserProfileResponse

  """Get order by order number"""
  orderByNumber(
    """Order number"""
    orderNumber: String
  ): OrderResponse
}

