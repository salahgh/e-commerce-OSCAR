# Vendure Admin API - Collection (Category) Operations

fragment CollectionFields on Collection {
  id
  createdAt
  updatedAt
  name
  slug
  description
  isPrivate
  position
  parentId
  breadcrumbs {
    id
    name
    slug
  }
  featuredAsset {
    id
    preview
    source
  }
  productVariants {
    totalItems
  }
  customFields {
    nameFr
    nameAr
    descriptionFr
    descriptionAr
    displayOrder
  }
}

query AdminCollections($options: CollectionListOptions) {
  collections(options: $options) {
    items {
      ...CollectionFields
    }
    totalItems
  }
}

query AdminCollection($id: ID!) {
  collection(id: $id) {
    ...CollectionFields
    filters {
      code
      args {
        name
        value
      }
    }
    children {
      id
      name
      slug
      position
      productVariants {
        totalItems
      }
      customFields {
        nameFr
        nameAr
      }
    }
  }
}

mutation CreateCollection($input: CreateCollectionInput!) {
  createCollection(input: $input) {
    ...CollectionFields
  }
}

mutation UpdateCollection($input: UpdateCollectionInput!) {
  updateCollection(input: $input) {
    ...CollectionFields
  }
}

mutation DeleteCollection($id: ID!) {
  deleteCollection(id: $id) {
    result
    message
  }
}

mutation MoveCollection($input: MoveCollectionInput!) {
  moveCollection(input: $input) {
    ...CollectionFields
  }
}
