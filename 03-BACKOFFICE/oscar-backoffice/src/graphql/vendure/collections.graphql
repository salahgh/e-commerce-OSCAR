# Vendure Admin API - Collection (Category) Operations

query AdminCollections($options: CollectionListOptions) {
  collections(options: $options) {
    items {
      id
      createdAt
      updatedAt
      name
      slug
      description
      isPrivate
      position
      parentId
      breadcrumbs {
        id
        name
        slug
      }
      featuredAsset {
        id
        preview
        source
      }
      productVariants {
        totalItems
      }
      customFields {
        nameFr
        nameAr
        descriptionFr
        descriptionAr
        displayOrder
      }
    }
    totalItems
  }
}

query AdminCollection($id: ID!) {
  collection(id: $id) {
    id
    createdAt
    updatedAt
    name
    slug
    description
    isPrivate
    position
    parentId
    breadcrumbs {
      id
      name
      slug
    }
    featuredAsset {
      id
      preview
      source
    }
    productVariants {
      totalItems
    }
    customFields {
      nameFr
      nameAr
      descriptionFr
      descriptionAr
      displayOrder
    }
    filters {
      code
      args {
        name
        value
      }
    }
    children {
      id
      name
      slug
      position
      productVariants {
        totalItems
      }
      customFields {
        nameFr
        nameAr
      }
    }
  }
}

mutation CreateCollection($input: CreateCollectionInput!) {
  createCollection(input: $input) {
    id
    name
    slug
    description
    isPrivate
    position
    parentId
    customFields {
      nameFr
      nameAr
      descriptionFr
      descriptionAr
      displayOrder
    }
  }
}

mutation UpdateCollection($input: UpdateCollectionInput!) {
  updateCollection(input: $input) {
    id
    name
    slug
    description
    isPrivate
    position
    parentId
    customFields {
      nameFr
      nameAr
      descriptionFr
      descriptionAr
      displayOrder
    }
  }
}

mutation DeleteCollection($id: ID!) {
  deleteCollection(id: $id) {
    result
    message
  }
}

mutation MoveCollection($input: MoveCollectionInput!) {
  moveCollection(input: $input) {
    id
    name
    slug
    position
    parentId
  }
}

# Update collection filters (for assigning products to collections)
mutation UpdateCollectionFilters($id: ID!, $filters: [ConfigurableOperationInput!]!) {
  updateCollection(input: { id: $id, filters: $filters }) {
    id
    name
    filters {
      code
      args {
        name
        value
      }
    }
  }
}

# Get all collections with their filters (for product-collection management)
query AdminCollectionsWithFilters($options: CollectionListOptions) {
  collections(options: $options) {
    items {
      id
      name
      slug
      parentId
      filters {
        code
        args {
          name
          value
        }
      }
    }
    totalItems
  }
}
