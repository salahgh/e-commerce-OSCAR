# Vendure Admin API - Authentication Operations

mutation AdminLogin($username: String!, $password: String!, $rememberMe: Boolean) {
  login(username: $username, password: $password, rememberMe: $rememberMe) {
    ... on CurrentUser {
      id
      identifier
      channels {
        id
        code
        token
        permissions
      }
    }
    ... on InvalidCredentialsError {
      errorCode
      message
    }
    ... on NativeAuthStrategyError {
      errorCode
      message
    }
  }
}

mutation AdminLogout {
  logout {
    success
  }
}

query Me {
  me {
    id
    identifier
    channels {
      id
      code
      token
      permissions
    }
  }
}

query ActiveAdministrator {
  activeAdministrator {
    id
    firstName
    lastName
    emailAddress
    user {
      id
      identifier
      roles {
        id
        code
        description
        permissions
      }
    }
  }
}
