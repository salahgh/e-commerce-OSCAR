# Vendure Admin API - Order Operations

query AdminOrders($options: OrderListOptions) {
  orders(options: $options) {
    items {
      id
      code
      state
      orderPlacedAt
      createdAt
      updatedAt
      totalWithTax
      total
      currencyCode
      customer {
        id
        firstName
        lastName
        emailAddress
        phoneNumber
      }
      shippingLines {
        shippingMethod {
          id
          name
        }
        priceWithTax
      }
      payments {
        id
        method
        state
        amount
      }
      customFields {
        customerNotes
        adminNotes
        trackingNumber
        wilaya
        cancellationReason
      }
    }
    totalItems
  }
}

query AdminOrder($id: ID!) {
  order(id: $id) {
    id
    code
    state
    active
    orderPlacedAt
    createdAt
    updatedAt
    totalWithTax
    total
    subTotal
    subTotalWithTax
    currencyCode
    shipping
    shippingWithTax
    couponCodes
    discounts {
      type
      description
      amountWithTax
    }
    customer {
      id
      firstName
      lastName
      emailAddress
      phoneNumber
      customFields {
        wilaya
        city
      }
    }
    shippingAddress {
      fullName
      company
      streetLine1
      streetLine2
      city
      province
      postalCode
      country
      phoneNumber
    }
    billingAddress {
      fullName
      company
      streetLine1
      streetLine2
      city
      province
      postalCode
      country
      phoneNumber
    }
    lines {
      id
      quantity
      unitPrice
      unitPriceWithTax
      linePrice
      linePriceWithTax
      productVariant {
        id
        sku
        name
        product {
          id
          name
          featuredAsset {
            preview
          }
          customFields {
            nameFr
          }
        }
      }
    }
    shippingLines {
      shippingMethod {
        id
        name
        code
      }
      price
      priceWithTax
    }
    payments {
      id
      method
      state
      amount
      transactionId
      createdAt
      metadata
    }
    fulfillments {
      id
      state
      method
      trackingCode
      createdAt
      lines {
        orderLineId
        quantity
      }
    }
    history(options: { take: 50, sort: { createdAt: DESC } }) {
      items {
        id
        type
        createdAt
        data
        administrator {
          id
          firstName
          lastName
        }
      }
    }
    customFields {
      customerNotes
      adminNotes
      trackingNumber
      wilaya
      cancellationReason
    }
  }
}

# Transition order to a new state
mutation TransitionOrderToState($id: ID!, $state: String!) {
  transitionOrderToState(id: $id, state: $state) {
    ... on Order {
      id
      state
    }
    ... on OrderStateTransitionError {
      errorCode
      message
      transitionError
      fromState
      toState
    }
  }
}

# Add a note to order history
mutation AddNoteToOrder($input: AddNoteToOrderInput!) {
  addNoteToOrder(input: $input) {
    id
  }
}

# Update order custom fields (tracking, notes)
mutation UpdateOrderCustomFields($input: UpdateOrderInput!) {
  setOrderCustomFields(input: $input) {
    id
    customFields {
      trackingNumber
      adminNotes
      wilaya
    }
  }
}

# Cancel an order
mutation CancelOrder($input: CancelOrderInput!) {
  cancelOrder(input: $input) {
    ... on Order {
      id
      state
    }
    ... on EmptyOrderLineSelectionError {
      errorCode
      message
    }
    ... on QuantityTooGreatError {
      errorCode
      message
    }
    ... on MultipleOrderError {
      errorCode
      message
    }
    ... on CancelActiveOrderError {
      errorCode
      message
      orderState
    }
    ... on OrderStateTransitionError {
      errorCode
      message
      transitionError
    }
  }
}

# Create fulfillment
mutation CreateFulfillment($input: FulfillOrderInput!) {
  addFulfillmentToOrder(input: $input) {
    ... on Fulfillment {
      id
      state
      trackingCode
      method
    }
    ... on EmptyOrderLineSelectionError {
      errorCode
      message
    }
    ... on ItemsAlreadyFulfilledError {
      errorCode
      message
    }
    ... on InsufficientStockOnHandError {
      errorCode
      message
    }
    ... on CreateFulfillmentError {
      errorCode
      message
    }
    ... on FulfillmentStateTransitionError {
      errorCode
      message
    }
  }
}
