# Dashboard queries for OSCAR Backoffice

query OscarDashboardStats {
  oscarDashboardStats {
    totalOrders
    totalRevenue
    totalCustomers
    totalProducts
    pendingOrders
    lowStockProductsCount
  }
}

query RecentOrders {
  orders(options: { take: 5, sort: { orderPlacedAt: DESC } }) {
    items {
      id
      code
      state
      totalWithTax
      orderPlacedAt
      customer {
        id
        firstName
        lastName
      }
      customFields {
        trackingNumber
        wilaya
      }
    }
    totalItems
  }
}

query LowStockProducts($threshold: Int) {
  lowStockProducts(threshold: $threshold) {
    id
    name
    slug
    variants {
      id
      sku
      stockOnHand
      customFields {
        minStockAlert
      }
    }
    customFields {
      nameFr
    }
  }
}

# Get orders for sales analysis (with line items for category/product breakdown)
query DashboardOrdersAnalysis($options: OrderListOptions) {
  orders(options: $options) {
    items {
      id
      code
      state
      totalWithTax
      orderPlacedAt
      lines {
        id
        quantity
        linePriceWithTax
        productVariant {
          id
          name
          sku
          product {
            id
            name
            slug
            featuredAsset {
              preview
            }
            collections {
              id
              name
              slug
            }
            customFields {
              nameFr
            }
          }
        }
      }
    }
    totalItems
  }
}

# Get top products for the dashboard
query DashboardTopProducts($options: ProductListOptions) {
  products(options: $options) {
    items {
      id
      name
      slug
      featuredAsset {
        preview
      }
      customFields {
        nameFr
        viewCount
      }
      variants {
        id
        stockOnHand
        priceWithTax
      }
    }
    totalItems
  }
}
