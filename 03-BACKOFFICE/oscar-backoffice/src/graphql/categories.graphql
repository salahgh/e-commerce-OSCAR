# Category Mutations

mutation CreateCategory($input: CreateCategoryRequestInput!) {
  createCategory(input: $input) {
    id
    slug
    nameFr
    nameAr
    nameEn
    descriptionFr
    descriptionAr
    descriptionEn
    parentId
    imageUrl
    displayOrder
    isActive
    createdAt
    updatedAt
  }
}

mutation UpdateCategory($id: Long!, $input: UpdateCategoryRequestInput!) {
  updateCategory(id: $id, input: $input) {
    id
    slug
    nameFr
    nameAr
    nameEn
    descriptionFr
    descriptionAr
    descriptionEn
    parentId
    imageUrl
    displayOrder
    isActive
    createdAt
    updatedAt
  }
}

mutation DeleteCategory($id: Long!) {
  deleteCategory(id: $id)
}
