# Category Queries

query Categories {
  categories {
    id
    slug
    nameFr
    nameAr
    nameEn
    descriptionFr
    descriptionAr
    descriptionEn
    parentId
    parentName
    imageUrl
    displayOrder
    isActive
    productCount
    createdAt
    updatedAt
    children {
      id
      slug
      nameFr
      nameAr
      nameEn
      parentId
      displayOrder
      isActive
      productCount
    }
  }
}

query Category($id: Long!) {
  category(id: $id) {
    id
    slug
    nameFr
    nameAr
    nameEn
    descriptionFr
    descriptionAr
    descriptionEn
    parentId
    parentName
    imageUrl
    displayOrder
    isActive
    productCount
    createdAt
    updatedAt
    children {
      id
      slug
      nameFr
      nameAr
      nameEn
      isActive
      productCount
    }
  }
}

query CategoryBySlug($slug: String!) {
  categoryBySlug(slug: $slug) {
    id
    slug
    nameFr
    nameAr
    nameEn
    descriptionFr
    descriptionAr
    descriptionEn
    parentId
    parentName
    imageUrl
    displayOrder
    isActive
    productCount
