# Product Queries

query Products($page: Int = 0, $size: Int = 20, $sortBy: String = "createdAt", $sortDirection: String = "DESC") {
  products(page: $page, size: $size, sortBy: $sortBy, sortDirection: $sortDirection) {
    content {
      id
      sku
      nameFr
      nameAr
      nameEn
      descriptionFr
      descriptionAr
      descriptionEn
      basePrice
      salePrice
      stockQuantity
      categoryId
      categoryName
      isFeatured
      imageUrls
      availableSizes
      availableColors
      viewCount
      createdAt
      updatedAt
    }
    totalElements
    totalPages
    number
    size
    first
    last
    hasNext
    hasPrevious
  }
}

query Product($id: Long!) {
  product(id: $id) {
    id
    sku
    nameFr
    nameAr
    nameEn
    descriptionFr
    descriptionAr
    descriptionEn
    basePrice
    salePrice
    stockQuantity
    categoryId
    categoryName
