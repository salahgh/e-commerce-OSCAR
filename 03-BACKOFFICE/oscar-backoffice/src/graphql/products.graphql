# Product Mutations

mutation CreateProduct($input: CreateProductRequestInput!) {
  createProduct(input: $input) {
    id
    sku
    nameFr
    nameAr
    nameEn
    descriptionFr
    descriptionAr
    descriptionEn
    basePrice
    salePrice
    stockQuantity
    categoryId
    categoryName
    isFeatured
    imageUrls
    availableSizes
    availableColors
    createdAt
    updatedAt
  }
}

mutation UpdateProduct($id: Long!, $input: UpdateProductRequestInput!) {
  updateProduct(id: $id, input: $input) {
    id
    sku
    nameFr
    nameAr
    nameEn
    descriptionFr
    descriptionAr
    descriptionEn
    basePrice
    salePrice
    stockQuantity
    categoryId
    categoryName
    isFeatured
    imageUrls
    availableSizes
    availableColors
    createdAt
    updatedAt
  }
}

mutation DeleteProduct($id: Long!) {
  deleteProduct(id: $id)
}
