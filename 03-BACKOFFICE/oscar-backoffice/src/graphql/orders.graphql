# Order Queries

query AllOrders($page: Int = 0, $size: Int = 20) {
  allOrders(page: $page, size: $size) {
    content {
      id
      orderNumber
      userId
      userEmail
      status
      paymentMethod
      subtotal
      shippingCost
      totalAmount
      phoneNumber
      shippingAddress
      notes
      trackingNumber
      createdAt
      updatedAt
      deliveredAt
      paidAt
      items {
        id
        productId
        productName
        productImage
        quantity
        price
        selectedSize
        selectedColor
        subtotal
      }
    }
    totalElements
    totalPages
    number
    size
    first
    last
    hasNext
    hasPrevious
  }
}

query Order($id: Long!) {
  order(id: $id) {
    id
    orderNumber
    userId
    userEmail
    status
    paymentMethod
    subtotal
    shippingCost
    totalAmount
    phoneNumber
    shippingAddress
    notes
    trackingNumber
    createdAt
    updatedAt
    deliveredAt
    paidAt
    items {
      id
      productId
      productName
      productImage
      quantity
      price
      selectedSize
      selectedColor
      subtotal
