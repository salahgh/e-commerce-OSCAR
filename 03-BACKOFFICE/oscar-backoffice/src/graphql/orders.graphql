# Order Mutations

mutation CreateOrder($input: CreateOrderRequestInput!) {
  createOrder(input: $input) {
    id
    orderNumber
    status
    paymentMethod
    subtotal
    shippingCost
    totalAmount
    phoneNumber
    shippingAddress
    notes
    createdAt
  }
}

mutation UpdateOrderStatus($id: Long!, $input: UpdateOrderStatusRequestInput!) {
  updateOrderStatus(id: $id, input: $input) {
    id
    orderNumber
    status
    trackingNumber
    updatedAt
    deliveredAt
  }
}

mutation CancelOrder($id: Long!) {
  cancelOrder(id: $id) {
    id
    orderNumber
    status
    updatedAt
  }
}
