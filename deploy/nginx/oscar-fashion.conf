# OSCAR Fashion — nginx site config.
#
# Installed by deploy/scripts/08-nginx-apply.sh at:
#   /etc/nginx/sites-available/oscar-fashion
# Symlinked from /etc/nginx/sites-enabled/oscar-fashion.
#
# Hostnames handled here:
#   oscarfashion.dz, www.oscarfashion.dz   → Next.js storefront (PM2 oscar-frontend on :3001)
#   api.oscarfashion.dz                    → Vendure API + admin UI + /assets (:8085)
#   admin.oscarfashion.dz                  → Custom back-office SPA (static, served from disk)
#
# Existing nginx sites on this VPS (e.g. promostore.oscarfashion.dz) are
# in OTHER files and are not affected.
#
# TLS certs are issued by certbot --nginx in the install script. After
# the first successful run, certbot will rewrite the `listen 443` blocks
# below to point at /etc/letsencrypt/live/<host>/{fullchain,privkey}.pem
# and add the include lines for ssl_options + dhparam.
# The existing oscarfashion.dz cert is reused (the old block in
# oscar-fidelity created it but never had a working HTTPS proxy).

# ────────────────────────────────────────────────────────────────
# Storefront — oscarfashion.dz / www.oscarfashion.dz → :3001
# ────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name oscarfashion.dz www.oscarfashion.dz;

    # ACME HTTP-01 challenge (certbot renew). Must NOT be redirected.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }
    location / {
        return 301 https://oscarfashion.dz$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name oscarfashion.dz www.oscarfashion.dz;

    ssl_certificate     /etc/letsencrypt/live/oscarfashion.dz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oscarfashion.dz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    # Canonical to apex (avoid www in HTTPS too)
    if ($host = www.oscarfashion.dz) {
        return 301 https://oscarfashion.dz$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }
}

# ────────────────────────────────────────────────────────────────
# Vendure API + admin UI + asset server — api.oscarfashion.dz → :8085
# ────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.oscarfashion.dz;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.oscarfashion.dz;

    # certbot --nginx will fill these in on first run.
    ssl_certificate     /etc/letsencrypt/live/api.oscarfashion.dz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.oscarfashion.dz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        # Apollo subscriptions / Vendure live updates need WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }
}

# ────────────────────────────────────────────────────────────────
# Back-office SPA (static files) — admin.oscarfashion.dz
# ────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name admin.oscarfashion.dz;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name admin.oscarfashion.dz;

    ssl_certificate     /etc/letsencrypt/live/admin.oscarfashion.dz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.oscarfashion.dz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/oscar/apps/backoffice/dist;
    index index.html;

    # gzip is already on globally in /etc/nginx/nginx.conf — no need to
    # re-enable here.

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed static assets (Vite outputs content-hashed names)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
